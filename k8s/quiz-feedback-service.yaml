apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-feedback-service
  namespace: learnhub
  labels:
    app: quiz-feedback-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quiz-feedback-service
  template:
    metadata:
      labels:
        app: quiz-feedback-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8089"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: quiz-feedback-service
        image: syrinaaa/quiz-feedback-service:latest
        ports:
        - containerPort: 8089
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-service:3306/quiz_feedback_db"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: MYSQL_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: MYSQL_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8089
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8089
          initialDelaySeconds: 90
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: quiz-feedback-service-service
  namespace: learnhub
  labels:
    app: quiz-feedback-service
spec:
  selector:
    app: quiz-feedback-service
  ports:
  - port: 8089
    targetPort: 8089
    name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quiz-feedback-service-hpa
  namespace: learnhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quiz-feedback-service
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80