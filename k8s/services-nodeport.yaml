# Services NodePort pour accès externe aux services
# Ces services permettent d'accéder aux applications depuis l'extérieur du cluster

apiVersion: v1
kind: Service
metadata:
  name: eureka-server-nodeport
  namespace: learnhub
  labels:
    app: eureka-server
    service-type: nodeport
spec:
  type: NodePort
  selector:
    app: eureka-server
  ports:
  - port: 8761
    targetPort: 8761
    nodePort: 30761
    name: http

