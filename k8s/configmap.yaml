apiVersion: v1
kind: ConfigMap
metadata:
  name: learnhub-config
  namespace: learnhub
data:
  # Database Configuration
  MYSQL_DATABASE: "quiz_feedback_db"
  MYSQL_USER: "quiz_user"
  
  # Spring Configuration
  SPRING_PROFILES_ACTIVE: "kubernetes"
  
  # Eureka Configuration
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server-service:8761/eureka/"
  
  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_ELEARNING: "DEBUG"

---
apiVersion: v1
kind: Secret
metadata:
  name: learnhub-secrets
  namespace: learnhub
type: Opaque
data:
  # Base64 encoded values
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk  # rootpassword
  MYSQL_PASSWORD: cXVpel9wYXNzd29yZA==      # quiz_password
  OPENAI_API_KEY: eW91ci1vcGVuYWktYXBpLWtleS1oZXJl  # your-openai-api-key-here