<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Commande Vocale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        #micButton {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 3rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            margin: 20px 0;
        }
        
        #micButton:hover {
            transform: scale(1.1);
        }
        
        #micButton.listening {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            animation: pulse 1.5s ease-out infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            50% {
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
        
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f3f4f6;
            min-height: 50px;
            font-size: 1.1rem;
        }
        
        #transcript {
            margin-top: 15px;
            padding: 15px;
            background: #e0e7ff;
            border-radius: 10px;
            color: #667eea;
            font-weight: bold;
            min-height: 40px;
        }
        
        .info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #6b7280;
        }
        
        .commands {
            margin-top: 20px;
            text-align: left;
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
        }
        
        .commands h3 {
            color: #667eea;
            margin-top: 0;
        }
        
        .commands ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .commands li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Test Commande Vocale</h1>
        
        <button id="micButton" onclick="toggleListening()">🎤</button>
        
        <div id="status">Cliquez sur le micro ou appuyez sur "M"</div>
        <div id="transcript"></div>
        
        <div class="info">
            <p>⌨️ Raccourci: Appuyez sur <strong>M</strong></p>
            <p>🌐 Navigateur: Chrome ou Edge requis</p>
        </div>
        
        <div class="commands">
            <h3>Commandes disponibles:</h3>
            <ul>
                <li>"quiz" ou "quizzes"</li>
                <li>"dashboard" ou "admin"</li>
                <li>"feedback" ou "avis"</li>
                <li>"générateur" ou "ia quiz"</li>
                <li>"accueil" ou "home"</li>
            </ul>
        </div>
    </div>

    <script>
        let recognition;
        let isListening = false;
        
        // Vérifier le support du navigateur
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            document.getElementById('status').innerHTML = '❌ Votre navigateur ne supporte pas la reconnaissance vocale.<br>Utilisez Chrome ou Edge.';
            document.getElementById('micButton').disabled = true;
            document.getElementById('micButton').style.background = '#9ca3af';
        } else {
            // Initialiser la reconnaissance vocale
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micButton').classList.add('listening');
                document.getElementById('micButton').innerHTML = '🔴';
                document.getElementById('status').innerHTML = '🎙️ Écoute en cours... Parlez maintenant!';
                document.getElementById('transcript').innerHTML = '';
                console.log('🎤 Reconnaissance vocale démarrée');
            };
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                console.log('📝 Transcription:', transcript);
                document.getElementById('transcript').innerHTML = `Vous avez dit: "${transcript}"`;
                
                // Simuler la navigation
                if (transcript.includes('quiz')) {
                    document.getElementById('status').innerHTML = '✅ Navigation vers: Liste des quiz';
                } else if (transcript.includes('dashboard') || transcript.includes('admin')) {
                    document.getElementById('status').innerHTML = '✅ Navigation vers: Dashboard';
                } else if (transcript.includes('feedback') || transcript.includes('avis')) {
                    document.getElementById('status').innerHTML = '✅ Navigation vers: Feedbacks';
                } else if (transcript.includes('générateur') || transcript.includes('ia')) {
                    document.getElementById('status').innerHTML = '✅ Navigation vers: Générateur IA';
                } else if (transcript.includes('accueil') || transcript.includes('home')) {
                    document.getElementById('status').innerHTML = '✅ Navigation vers: Accueil';
                } else {
                    document.getElementById('status').innerHTML = '❌ Commande non reconnue. Essayez: "quiz", "dashboard", "feedback"...';
                }
            };
            
            recognition.onerror = (event) => {
                console.error('❌ Erreur:', event.error);
                isListening = false;
                document.getElementById('micButton').classList.remove('listening');
                document.getElementById('micButton').innerHTML = '🎤';
                
                switch (event.error) {
                    case 'no-speech':
                        document.getElementById('status').innerHTML = '⚠️ Aucune parole détectée';
                        break;
                    case 'audio-capture':
                        document.getElementById('status').innerHTML = '⚠️ Microphone non disponible';
                        break;
                    case 'not-allowed':
                        document.getElementById('status').innerHTML = '⚠️ Permission microphone refusée';
                        break;
                    default:
                        document.getElementById('status').innerHTML = `⚠️ Erreur: ${event.error}`;
                }
            };
            
            recognition.onend = () => {
                isListening = false;
                document.getElementById('micButton').classList.remove('listening');
                document.getElementById('micButton').innerHTML = '🎤';
                console.log('🛑 Reconnaissance vocale terminée');
            };
            
            console.log('✅ Web Speech API supportée et initialisée');
        }
        
        function toggleListening() {
            if (!recognition) return;
            
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }
        
        // Raccourci clavier "M"
        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'm' && !event.ctrlKey && !event.altKey && !event.shiftKey) {
                const target = event.target;
                const isInputField = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA';
                
                if (!isInputField) {
                    event.preventDefault();
                    toggleListening();
                    console.log('⌨️ Raccourci clavier "M" activé');
                }
            }
        });
        
        console.log('⌨️ Raccourci clavier configuré: Appuyez sur "M"');
    </script>
</body>
</html>
