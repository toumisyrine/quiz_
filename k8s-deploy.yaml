# Déploiement Kubernetes complet LearnHub
# Usage: kubectl apply -f k8s-deploy.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: learnhub

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: learnhub-config
  namespace: learnhub
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-service:8761/eureka/"
  MYSQL_DATABASE: "quiz_feedback_db"
  MYSQL_USER: "quiz_user"

---
# Secrets
apiVersion: v1
kind: Secret
metadata:
  name: learnhub-secrets
  namespace: learnhub
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk  # rootpassword
  MYSQL_PASSWORD: cXVpel9wYXNzd29yZA==      # quiz_password
  OPENAI_API_KEY: eW91ci1vcGVuYWktYXBpLWtleS1oZXJl  # your-openai-api-key-here

---
# MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: learnhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: MYSQL_PASSWORD

---
# MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: learnhub
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306

---
# Eureka Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: learnhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka-server
        image: syrinaaa/eureka-server:latest
        ports:
        - containerPort: 8761
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: SPRING_PROFILES_ACTIVE

---
# Eureka Service
apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  namespace: learnhub
spec:
  selector:
    app: eureka-server
  ports:
  - port: 8761
    targetPort: 8761
  type: NodePort
  
---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: learnhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: syrinaaa/api-gateway:latest
        ports:
        - containerPort: 8888
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE

---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: learnhub
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8888
    targetPort: 8888
  type: NodePort

---
# Quiz Feedback Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-feedback-service
  namespace: learnhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-feedback-service
  template:
    metadata:
      labels:
        app: quiz-feedback-service
    spec:
      containers:
      - name: quiz-feedback-service
        image: syrinaaa/quiz-feedback-service:latest
        ports:
        - containerPort: 8089
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-service:3306/quiz_feedback_db"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: MYSQL_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: MYSQL_PASSWORD

---
# Quiz Feedback Service
apiVersion: v1
kind: Service
metadata:
  name: quiz-feedback-service
  namespace: learnhub
spec:
  selector:
    app: quiz-feedback-service
  ports:
  - port: 8089
    targetPort: 8089
  type: NodePort

---
# AI Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: learnhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: syrinaaa/ai-service:latest
        ports:
        - containerPort: 8090
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: OPENAI_API_KEY

---
# AI Service
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: learnhub
spec:
  selector:
    app: ai-service
  ports:
  - port: 8090
    targetPort: 8090
  type: NodePort

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: learnhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: syrinaaa/frontend:latest
        ports:
        - containerPort: 80

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: learnhub
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
  type: NodePort